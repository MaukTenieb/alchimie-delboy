<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Liseuse — Hervé Delboy, alchimie</title>
<style>
  :root{
    --bg:#faf6ee; --ink:#241f18; --soft:#6b5d4b; --rule:#ddd2be;
    --accent:#7b2d1c; --size:19px; --lead:1.62; --width:38rem;
    --font:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  }
  [data-theme="sepia"]{--bg:#f3e7d3; --ink:#3a2c1b; --soft:#6d5a41; --rule:#d8c4a4}
  [data-theme="nuit"]{--bg:#14120f; --ink:#e8e0d2; --soft:#a4977f; --rule:#332c22; --accent:#d99b6c}
  [data-theme="clair"]{--bg:#fff; --ink:#181614; --soft:#5d574e; --rule:#e2ddd4}
  *{box-sizing:border-box}
  html,body{margin:0; background:var(--bg); color:var(--ink)}
  body{font-family:var(--font); font-size:var(--size); line-height:var(--lead)}
  a{color:var(--accent); text-decoration:none}
  a:hover{text-decoration:underline}

  .bar{position:sticky; top:0; z-index:30; display:flex; gap:.55rem;
    align-items:center; flex-wrap:wrap; padding:.45rem .8rem;
    background:color-mix(in srgb, var(--bg) 92%, transparent);
    backdrop-filter:blur(8px); border-bottom:1px solid var(--rule);
    font-family:system-ui,-apple-system,Segoe UI,sans-serif; font-size:.78rem}
  .bar .t{font-weight:600; margin-right:auto; max-width:44vw; overflow:hidden;
    text-overflow:ellipsis; white-space:nowrap}
  .bar button,.bar select{font:inherit; color:var(--ink); background:transparent;
    border:1px solid var(--rule); border-radius:5px; padding:.22rem .5rem;
    cursor:pointer}
  .bar button:hover{background:rgba(120,90,50,.08)}
  .bar .grp{display:flex; gap:.2rem; align-items:center}
  .bar .sep{width:1px; height:1.2rem; background:var(--rule); margin:0 .2rem}

  .wrap{max-width:var(--width); margin:0 auto; padding:2.6rem 1.4rem 6rem}
  h1{font-size:1.75em; line-height:1.2; margin:0 0 .3em}
  .meta{font-family:system-ui,sans-serif; font-size:.72em; color:var(--soft);
    border-bottom:1px solid var(--rule); padding-bottom:1rem; margin-bottom:1.6rem}
  h2{font-size:1.24em; margin:1.7em 0 .5em; color:var(--accent)}
  h3{font-size:1.05em; margin:1.3em 0 .4em}
  p{margin:0 0 1em; text-align:justify; hyphens:auto}
  figure{margin:1.6em 0; text-align:center}
  figure img{max-width:100%; height:auto; border:1px solid var(--rule);
    background:#fff; padding:.4rem}
  figcaption{font-family:system-ui,sans-serif; font-size:.7em; color:var(--soft);
    margin-top:.4em}

  #toc{position:fixed; top:0; left:0; bottom:0; width:19rem; z-index:40;
    background:var(--bg); border-right:1px solid var(--rule); padding:1rem 1.1rem;
    overflow:auto; transform:translateX(-102%); transition:transform .18s;
    font-family:system-ui,sans-serif; font-size:.8rem}
  #toc.open{transform:none}
  #toc h3{margin:.2rem 0 .8rem; font-size:.72rem; text-transform:uppercase;
    letter-spacing:.1em; color:var(--soft)}
  #toc a{display:block; padding:.22rem 0; color:var(--ink); border-bottom:1px dotted var(--rule)}
  #toc a.lvl3{padding-left:.9rem; color:var(--soft)}
  #toc a.on{color:var(--accent); font-weight:600}

  @media print{
    .bar,#toc,.hint{display:none !important}
    .wrap{max-width:none; padding:0}
    body{font-size:11pt; background:#fff; color:#000}
    a{color:#000}
    h2{page-break-after:avoid}
    figure{page-break-inside:avoid}
  }
  .hint{font-family:system-ui,sans-serif; font-size:.72rem; color:var(--soft);
    margin-top:3rem; border-top:1px solid var(--rule); padding-top:.8rem}
</style>
</head><body>

<div class="bar">
  <button id="tocbtn" title="Sommaire">☰ Sommaire</button>
  <span class="t" id="title">Chargement…</span>
  <span class="grp"><button id="minus" title="Réduire le texte">A−</button>
    <button id="plus" title="Agrandir le texte">A+</button></span>
  <select id="font" title="Typographie">
    <option value='"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif'>Sérif</option>
    <option value='Georgia,"Times New Roman",serif'>Times</option>
    <option value='system-ui,-apple-system,Segoe UI,sans-serif'>Sans sérif</option>
    <option value='ui-monospace,Consolas,monospace'>Monospace</option>
  </select>
  <select id="theme" title="Fond">
    <option value="papier">Papier</option>
    <option value="sepia">Sépia</option>
    <option value="clair">Blanc</option>
    <option value="nuit">Nuit</option>
  </select>
  <span class="sep"></span>
  <button id="print" title="Imprimer ou enregistrer en PDF">PDF</button>
  <button id="dlhtml" title="Télécharger en HTML autonome">HTML</button>
  <button id="dltxt" title="Télécharger en texte">TXT</button>
  <button id="close" title="Retour à l’article">✕</button>
</div>

<nav id="toc" aria-label="Sommaire"><h3>Sommaire</h3><div id="toclist"></div></nav>
<main class="wrap" id="content"><p>Chargement…</p></main>
<p class="hint" id="hint"></p>

<script>
const $ = s => document.querySelector(s);
const params = new URLSearchParams(location.search);
const SLUG = params.get("p") || "";
const SITE_TITLE = "Hervé Delboy — alchimie";
let DOC = null, DOC_HTML = "", TITLE = "", SRC = "";

/* préférences de lecture, conservées d'une séance à l'autre */
const prefs = JSON.parse(localStorage.getItem("liseuse") || "{}");
const apply = () => {
  document.documentElement.style.setProperty("--size", (prefs.size || 19) + "px");
  document.documentElement.style.setProperty("--width", (prefs.width || 38) + "rem");
  document.documentElement.style.setProperty("--lead", prefs.lead || 1.62);
  if (prefs.font) document.documentElement.style.setProperty("--font", prefs.font);
  document.documentElement.dataset.theme = prefs.theme || "papier";
  $("#font").value = prefs.font || "";
  $("#theme").value = prefs.theme || "papier";
};
const save = () => localStorage.setItem("liseuse", JSON.stringify(prefs));

async function load(){
  if (!SLUG){ $("#content").innerHTML = "<p>Aucun texte demandé. Ouvrez un article puis « Lire ».</p>"; return; }
  const url = "articles/" + SLUG + ".html";
  const html = await fetch(url).then(r => r.text());
  const doc = new DOMParser().parseFromString(html, "text/html");
  TITLE = doc.querySelector("h1")?.textContent?.trim() || SLUG;
  document.title = TITLE + " — lecture";
  $("#title").textContent = TITLE;

  const metaEl = doc.querySelector(".meta");
  SRC = metaEl ? metaEl.innerHTML : "";
  const prose = doc.querySelector(".prose");
  const gallery = doc.querySelector(".gallery");

  const body = document.createElement("div");
  if (prose) body.append(...prose.childNodes);
  if (gallery){
    const h = document.createElement("h2"); h.textContent = "Illustrations";
    body.append(h);
    gallery.querySelectorAll("figure").forEach(f => body.append(f.cloneNode(true)));
  }
  $(".wrap").setAttribute("id", "content");
  $("#content").innerHTML = "";
  const h1 = document.createElement("h1"); h1.textContent = TITLE;
  $("#content").append(h1);
  if (metaEl){
    const m = document.createElement("div"); m.className = "meta";
    m.innerHTML = metaEl.innerHTML;
    /* le lien « lire » n’a pas de sens dans la liseuse */
    m.querySelectorAll("a").forEach(a => {
      if (a.textContent.trim().toLowerCase() === "lire") a.remove();
    });
    m.innerHTML = m.innerHTML.replace(/^\s*·\s*|\s*·\s*·\s*/g, " ");
    $("#content").append(m);
  }
  $("#content").append(body);

  /* liens relatifs des images et des renvois */
  $("#content").querySelectorAll("img[src]").forEach(i => {
    const s = i.getAttribute("src");
    if (s.startsWith("../")) i.setAttribute("src", s.slice(3));
  });
  $("#content").querySelectorAll("a[href^='../']").forEach(a => {
    a.setAttribute("href", a.getAttribute("href").slice(3));
  });

  buildToc();
  DOC_HTML = $("#content").innerHTML;
  $("#hint").innerHTML =
    "Sommaire : liste des titres. A−/A+ : taille du texte. PDF : impression " +
    "ou enregistrement au format PDF depuis la boîte d’impression. " +
    "HTML : fichier autonome, lisible hors ligne. TXT : texte seul.";
}

function buildToc(){
  const list = $("#toclist");
  const heads = [...$("#content").querySelectorAll("h2,h3")];
  list.innerHTML = heads.map((h, i) => {
    h.id = h.id || "h" + i;
    return `<a href="#${h.id}" class="${h.tagName === "H3" ? "lvl3" : ""}">` +
      h.textContent.replace(/</g, "&lt;") + "</a>";
  }).join("") || "<span style='color:var(--soft)'>Ce texte n’a pas de titres.</span>";
  list.querySelectorAll("a").forEach(a => a.onclick = () => $("#toc").classList.remove("open"));
}

$("#tocbtn").onclick = () => $("#toc").classList.toggle("open");
$("#plus").onclick = () => { prefs.size = Math.min(34, (prefs.size || 19) + 1); apply(); save(); };
$("#minus").onclick = () => { prefs.size = Math.max(13, (prefs.size || 19) - 1); apply(); save(); };
$("#font").onchange = e => { prefs.font = e.target.value; apply(); save(); };
$("#theme").onchange = e => { prefs.theme = e.target.value; apply(); save(); };
$("#print").onclick = () => window.print();
$("#close").onclick = () => { location.href = "articles/" + SLUG + ".html"; };

function download(name, text, type){
  const blob = new Blob([text], { type: type + ";charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

$("#dlhtml").onclick = () => {
  const html = `<!doctype html><html lang="fr"><head><meta charset="utf-8">
<title>${TITLE}</title><style>
body{max-width:38rem;margin:2rem auto;padding:0 1.2rem;font:19px/1.62 Georgia,serif;color:#241f18}
h1{line-height:1.2} h2{color:#7b2d1c} p{text-align:justify}
figure{text-align:center} img{max-width:100%;height:auto}
figcaption{font-size:.72em;color:#6b5d4b} .meta{color:#6b5d4b;font-size:.8em;
border-bottom:1px solid #ddd2be;padding-bottom:.8rem}
</style></head><body><h1>${TITLE}</h1>${SRC ? `<div class="meta">${SRC}</div>` : ""}
${DOC_HTML.replace(/^<h1>.*?<\/h1>/, "").replace(/<div class="meta">.*?<\/div>/, "")}
</body></html>`;
  download(SLUG + ".html", html, "text/html");
};

$("#dltxt").onclick = () => {
  const txt = $("#content").innerText
    .replace(/\n{3,}/g, "\n\n").trim();
  download(SLUG + ".txt", TITLE + "\n\n" + txt + "\n", "text/plain");
};

document.addEventListener("keydown", e => {
  if (e.key === "+" || e.key === "=") $("#plus").click();
  if (e.key === "-") $("#minus").click();
  if (e.key === "Escape") $("#toc").classList.remove("open");
});

apply();
load().catch(e => {
  $("#content").innerHTML = "<p>Le texte n’a pas pu être chargé : " + e.message +
    ". La liseuse doit être ouverte depuis le site (adresse http), pas en file://.</p>";
});
</script>
</body></html>
