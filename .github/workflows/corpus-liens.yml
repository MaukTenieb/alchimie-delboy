name: Liens du corpus

on:
  schedule:
    - cron: "41 4 * * 1"
  push:
    branches: [main]
    paths: [corpus/corpus.json]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  liens:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/corpus_liens.py
